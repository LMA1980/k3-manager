[package]
name = "k3-manager"
description = "Control plane and IPC daemon for the SpacemiT K3 AI platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/k3-manager"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[dependencies]
k3-core = { version = "0.1.0", git = "https://github.com/LMA1980/k3-core.git" }
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
fory = "1.7.7"
libc = "0.2"
tokio = { version = "1.54.1", features = ["process", "rt", "net", "io-util", "sync", "macros", "signal"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

[dev-dependencies]
k3-kv = { version = "0.1.0", git = "https://github.com/LMA1980/k3-kv.git" }
